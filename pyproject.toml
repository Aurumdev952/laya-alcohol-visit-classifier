[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-sentiment-api"
version = "0.1.0"
description = "Local CUDA sentiment and decision recipe API powered by Laya"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "laya==0.3.20",
    "pydantic==2.11.7",
    "torch==2.14.0",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
train = [
    "huggingface_hub>=0.30,<2",
    "safetensors>=0.5,<1",
    "transformers>=4.48,<6",
]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
include = ["sentiment_api*", "alcohol_ft*"]
